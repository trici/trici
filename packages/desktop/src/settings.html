<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings
  </title>
</head>
<body>
  <div id="root"></div>
  <script>
    console.log('loading settings app');
    (function() {
      console.log("Inside IIFE");
      const script = document.createElement('script');
      if (bridgeApi.env === 'development') {
        script.src = '../dist/dev/settings.app.js'
      } else if (bridgeApi.env === 'livedev'){
        script.src = '../dist/live/settings.app.js';
      } else {
        script.src = '../dist/settings.app.js';
      }
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
