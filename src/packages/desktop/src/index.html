<!DOCTYPE html>
<html lang="en" class="h-screen w-screen m-0 p-0">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trici
  </title>
  <link rel="stylesheet" href="../dist/trici.output.css">
  <link rel="stylesheet" href="../resources/stylesheets/video-js.min.css">
  <style>
    @import url('../resources/fonts/opensans/OpenSans-Regular.ttf');
    @font-face {
      font-family: 'OpenSans';
      src: url('../resources/fonts/opensans/OpenSans-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
  </style>
</head>
<body class="h-screen w-screen m-0 p-0">
  <div id="root" class="h-full w-full overflow-hidden"></div>
  <script>
    function getScriptUrlByEnv(type) {
      if (bridgeApi.env === 'development') {
        return `../dist/dev/${type}.app.js`;
      } else if (bridgeApi.env === 'livedev') {
        return `../dist/live/${type}.app.js`;
      } else {
        return `../dist/${type}.app.js`;
      }
    }
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    // var root = document.getElementById('root');
    // if (type === 'settings') {
    //   document.title = 'Trici Settings';
    //   root.style.height = '100vh';
    //   root.style.width = '100vw';
    // } else if (type === 'eventviewer') {
    //   document.title = 'Trici Event Viewer';
    //   root.style.height = '100vh';
    //   root.style.width = '100vw';
    // } else if (type === 'trici') {
    //   document.title = 'Trici';
    //   // root.style.height = '100%';
    //   // root.style.width = '100%';
    // }
    let scriptUrl = getScriptUrlByEnv(type);
    (function() {
      console.log("Inside IIFE");
      console.log("scriptUrl", scriptUrl);
      const script = document.createElement('script');
      script.src = scriptUrl;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
