<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trici
  </title>
</head>
<body id="triciwindow">
  <div id="root"></div>
  <script>
    function getScriptUrlByEnv(type) {
      if (bridgeApi.env === 'development') {
        return `../dist/dev/${type}.app.js`;
      } else if (bridgeApi.env === 'livedev') {
        return `../dist/live/${type}.app.js`;
      } else {
        return `../dist/${type}.app.js`;
      }
    }
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    if (type === 'main') {
      document.getElementById('triciwindow').style.backgroundColor = 'rgb(255, 255, 255, 0.5)';
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          bridgeApi.sendMessage({handler: 'hideMainWindow', args: {}});
        }
      });
    }
    let scriptUrl = getScriptUrlByEnv(type);
    (function() {
      console.log("Inside IIFE");
      console.log("scriptUrl", scriptUrl);
      const script = document.createElement('script');
      script.src = scriptUrl;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
